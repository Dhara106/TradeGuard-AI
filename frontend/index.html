<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TradeGuard AI predicts shipment delays, explains logistics risk, and keeps every route visible."
    />
    <meta name="theme-color" content="#ffd02f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>TradeGuard AI — Shipment Risk Intelligence</title>
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('theme');
          document.documentElement.classList.add(savedTheme === 'dark' ? 'dark' : 'light');
        } catch (error) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
