# ============================================
# TradeGuard AI — nginx config for the SPA
# - Serves the built React app
# - Proxies /api/* to the Node.js gateway
# ============================================
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip for faster asset delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;
    gzip_min_length 1024;

    # Reverse-proxy API calls to the Node.js gateway service.
    # "backend-node" is the docker-compose service name (Docker DNS).
    location /api/ {
        proxy_pass         http://backend-node:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA fallback: any unknown route returns index.html so React Router works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
